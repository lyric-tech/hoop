{{- if .Values.kubernetesServiceAccountAccess.enabled -}}
{{- $ns := .Values.kubernetesServiceAccountAccess.namespace | default .Release.Namespace -}}
# Lets the agent mint short-lived tokens for the ServiceAccounts backing
# kubernetes connections (KUBERNETES_SERVICE_ACCOUNT). Without this the
# TokenRequest call returns 403 and those connections fail to open.
#
# resourceNames pins which accounts the agent may impersonate: leaving it
# empty grants every ServiceAccount in the namespace, which defeats the point
# of putting each connection behind its own account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hoopagent-serviceaccount-token
  namespace: {{ $ns }}
  labels:
    app: hoopagent
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    {{- with .Values.kubernetesServiceAccountAccess.serviceAccounts }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hoopagent-serviceaccount-token
  namespace: {{ $ns }}
  labels:
    app: hoopagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hoopagent-serviceaccount-token
subjects:
  - kind: ServiceAccount
    name: hoopagent
    namespace: {{ .Release.Namespace }}
{{- end }}
